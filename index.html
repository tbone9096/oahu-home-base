  --bg:#101814; --card:#17221c; --fg:#e6eee8; --muted:#97a89d; --line:#2a3a31; --leaf:#6fbf8a; --done:#5d6d63; --star:#f0b43c;

[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-size:clamp(1.8rem,8vw,2.5rem);line-height:1;margin:0;color:var(--leaf);text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}

.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--fg);border-radius:10px;overflow:hidden}
.seg button{font:700 .95rem var(--body);padding:9px 10px;border:0;background:var(--card);color:var(--fg);cursor:pointer}

.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--c-food);outline-offset:2px}
.tools{display:flex;flex-direction:column;gap:10px}

.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}

.search{font:400 1rem var(--body);padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box}
.toggle{font:500 .8rem var(--body);color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}

.date{font:500 .78rem var(--mono);color:var(--muted);line-height:1.25;font-variant-numeric:tabular-nums}

.txt{min-width:0;display:flex;flex-direction:column;gap:3px}

.chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--cc);margin-right:6px}
.t{font-weight:700;cursor:pointer}

.row:has(input:checked) .t{color:var(--done);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.82rem;color:var(--muted)}
.stars{display:inline-flex;gap:1px}
.stars button{all:unset;cursor:pointer;font-size:1.05rem;line-height:1;color:var(--line);padding:2px 1px}
.stars button.on{color:var(--star)}

.stars-label{font:500 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lnk{font:500 .78rem var(--mono);color:var(--fg);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.price{font:600 .86rem var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--leaf) 14%,transparent);padding:2px 8px;border-radius:4px}
.price small{font-weight:400;color:var(--muted)}

.how b.rs{background:color-mix(in srgb,var(--c-football) 25%,transparent)}
.mapbox{background:var(--sea);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.rlabel{font:600 15px var(--mono);letter-spacing:.18em;fill:var(--muted)}
.pin{cursor:pointer}.pin circle{stroke:var(--card);stroke-width:2.5}

.info{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:7px}

.spots button i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cc)}
.empty{color:var(--muted);font-size:.92rem;padding:12px 0}
.legend{font-size:.84rem;color:var(--muted);margin:0}
.sync{font:500 .72rem var(--mono);color:var(--muted)}

.wrap{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}

atever didn't fit the first day.", "p": ""}, {"id": "2027-03-06-Scout launch", "s": "2027-03-06", "e": null, "c": "Admin", "t": "Scout launches, Waianae coast", "n": "Note launch spots and parking.", "p": ""}, {"id": "2027-03-07-Ka'ena Point", "s": "2027-03-07", "e": null, "c": "Hike", "t": "Ka'ena Point (Waianae side)", "n": "Scout shore-fishing ledges on the way out.", "p": ""}, {"id": "2027-03-08-Register the", "s": "2027-03-08", "e": null, "c": "Admin", "t": "Register the car + kayak, get a Hawaii driver's license", "n": "DMV/satellite city hall for the car and license; harbor office for the kayak. Book appointments ahead.", "p": ""}, {"id": "2027-03-09-Shakedown pa", "s": "2027-03-09", "e": null, "c": "Fish", "t": "Shakedown paddle, Waianae", "n": "First run on the new kayak, inside the reef. Set up the fish finder and get used to the pedal drive. Move it to whichever weekday is calmest.", "p": "Short clip from the kayak looking back at the coast and mountains. First time on Hawaii water is the post."}, {"id": "2027-03-09-Highway Inn", "s": "2027-03-09", "e": null, "c": "Food", "t": "Highway Inn", "n": "Dinner. Squid luau with poi. Rideshare there and back.", "p": ""}, {"id": "2027-03-10-Birthday: wi", "s": "2027-03-10", "e": null, "c": "Food", "t": "Birthday: windward paddle + Liliha Drive Inn", "n": "Morning paddle off Kailua if it's calm, then walk-in dinner: NY steak + garlic shrimp combo and oxtail soup. No reservations needed. Closed Tuesdays only. Drive home from the paddle, then rideshare to dinner.", "p": "Selfie on the kayak with the Mokulua islands behind you, then the steak-and-shrimp plate. Post 'Birthday #1 in Hawaii.'"}, {"id": "2027-03-11-Pongo's Kitc", "s": "2027-03-11", "e": null, "c": "Food", "t": "Pongo's Kitchen", "n": "Lunch. Baked ahi. Weekdays only.", "p": ""}, {"id": "2027-03-11-Finish house", "s": "2027-03-11", "e": null, "c": "Admin", "t": "Finish house setup", "n": "Hang the rod racks, set up the gear room.", "p": "Before/after carou const saveLocal=()=>{try{localStorage.setItem("oahu-state",JSON.stringify(S))}catch(e){}};
const saveUI=()=>{try{localStorage.setItem("oahu-ui",JSON.stringify(UI))}catch(e){}};
function persist(){saveLocal();if(dbDoc){dirty=true;clearTimeout(timer);timer=setTimeout(flush,700)}}
async function flush(){
  if(!dbDoc||writing||!dirty)return;
  writing=true;dirty=false;
  try{await dbDoc.set({c:S.c,r:S.r,v:1})}
  catch(e){if(e&&["invalid_argument","revoked","not_granted","capability_disabled"].includes(e.code)){dbDoc=null;sync="Saved on this device only";setFoot()}}
  writing=false;if(dirty)flush();
}
(async()=>{
  try{
    const C=window.claude;if(!C||!C.use)return;
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc("data/users/"+id+"/state");
    const snap=await ref.get();
    let needWrite=!snap.exists;
    if(snap.exists){const d=snap.data()||{};
      const merged={c:Object.assign({},S.c,d.c||{}),r:Object.assign({},S.r,d.r||{})};
      needWrite=JSON.stringify(merged)!==JSON.stringify({c:d.c||{},r:d.r||{}});
      S=merged;saveLocal()}
    dbDoc=ref;sync="Synced to your Claude account";
    if(needWrite&&(Object.keys(S.c).length||Object.keys(S.r).length)){dirty=true;flush()}
    ref.onSnapshot(s=>{
      if(!s.exists||(s.metadata&&s.metadata.hasPendingWrites)||dirty||writing)return;
      const d=s.data()||{};S={c:d.c||{},r:d.r||{}};saveLocal();renderMain();renderNext();
    },()=>{});
    renderMain();renderNext();setFoot();
  }catch(e){}
})();

/* ---------- shared bits ---------- */
function stars(id){
  const v=S.r[id]||0;
  return `<span class="stars" role="group" aria-label="Your rating">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${esc(id)}" data-v="${n}" class="${v>=n?"on":""}" aria-label="Rate ${n} of 5">★</button>`).join("")}</span>`;
}
const dirLink=q=>q?`<a class="lnk" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}" target="_blank" rel="noopener">Directions ↗</a>`:"";
function setProgress(done,total,label){
  const el=$("#prog");if(!el)return;
  el.innerHTML=`<div class="bar"><i style="width:${total?done/total*100:0}%"></i></div><span>${done} / ${total} ${label}</span>`;
}
function today(){return new Date().toISOString().slice(0,10)}

/* ---------- header next-up ---------- */
function renderNext(){
  const t=today();
  const n=DATA.find(d=>d.c!=="Post"&&(d.e||d.s)>=t&&!S.c[d.id]);
  const el=$("#next");
  if(!n){el.innerHTML=`<b>Next up</b><span>Everything's checked off.</span>`;return}
  const days=Math.round((new Date(n.s+"T12:00:00")-new Date(t+"T12:00:00"))/864e5);
  el.innerHTML=`<b>Next up</b><span><strong>${fmt(n.s,{month:"short",day:"numeric",year:"numeric"})}</strong> · ${esc(n.t)}</span><em>${days<=0?"today":days===1?"tomorrow":"in "+days+" days"}</em>`;
}

/* ---------- navigation ---------- */
function renderNav(){
  $("#s-plan").setAttribute("aria-selected",UI.sec==="plan");
  $("#s-ref").setAttribute("aria-selected",UI.sec==="ref");
  const tabs=UI.sec==="plan"?PLAN_TABS:REF_TABS, cur=UI.sec==="plan"?UI.plan:UI.ref;
  $("#subtabs").innerHTML=tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===cur}">${l}</button>`).join("");
}
function go(){F={cat:"All",hideDone:F.hideDone,q:"",type:"All",mapF:"All",mapSel:null};saveUI();renderNav();renderTools();renderMain();setFoot()}
$("#s-plan").onclick=()=>{UI.sec="plan";go()};
$("#s-ref").onclick=()=>{UI.sec="ref";go()};
$("#subtabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;if(UI.sec==="plan")UI.plan=b.dataset.tab;else UI.ref=b.dataset.tab;go()});
const curTab=()=>UI.sec==="plan"?UI.plan:UI.ref;

/* ---------- tools row ---------- */
function refTypes(tab){return [...new Set(REF.filter(r=>r.tab===tab).map(r=>r.t))]}
function renderTools(){
  const tab=curTab();let h=`<div class="progress" id="prog"></div>`;
  if(UI.sec==="plan"&&tab==="cal"){
    const cats=["All",...Object.keys(CC).filter(c=>DATA.some(d=>d.c===c))];
    h+=`<div class="chips">${cats.map(c=>`<button data-cat="${c}" aria-pressed="${c===F.cat}">${c==="All"?"":`<i style="--cc:var(${CC[c]})"></i>`}${c}</button>`).join("")}</div>
      <label class="toggle"><input type="checkbox" id="hideDone" ${F.hideDone?"checked":""}> Hide finished items</label>`;
  }else if(UI.sec==="ref"&&tab!=="map"){
    const types=["All",...refTypes(tab)];
    h+=`<input class="search" id="q" type="search" placeholder="Search ${esc(REF_TABS.find(x=>x[0]===tab)[1].toLowerCase())}" value="${esc(F.q)}" autocomplete="off">
      <div class="chips">${types.map((t,i)=>`<button data-type="${esc(t)}" aria-pressed="${t===F.type}">${t==="All"?"":`<i style="--cc:var(${REF_TYPE_COLORS[(i-1)%REF_TYPE_COLORS.length]})"></i>`}${esc(t)}</button>`).join("")}</div>`;
  }
  $("#tools").innerHTML=h;
}
$("#tools").addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]");if(c){F.cat=c.dataset.cat;renderTools();renderMain();return}
  const t=e.target.closest("[data-type]");if(t){F.type=t.dataset.type;renderTools();renderMain();const q=$("#q");if(q)q.value=F.q}
});
$("#tools").addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value;renderMain()}});
$("#tools").addEventListener("change",e=>{if(e.target.id==="hideDone"){F.hideDone=e.target.checked;renderMain()}});

/* ---------- plan: calendar ---------- */
function renderCal(){
  const t=today();
  const nxt=DATA.find(d=>d.c!=="Post"&&(d.e||d.s)>=t&&!S.c[d.id]);
  const list=DATA.filter(d=>(F.cat==="All"||d.c===F.cat)&&!(F.hideDone&&S.c[d.id]));
  const months={};list.forEach(d=>{(months[d.s.slice(0,7)]=months[d.s.slice(0,7)]||[]).push(d)});
  const all=DATA.filter(d=>F.cat==="All"||d.c===F.cat);
  setProgress(all.filter(d=>S.c[d.id]).length,all.length,"done");
  if(!list.length)return `<p class="empty">Nothing left here. Turn off "Hide finished items" to see everything.</p>`;
  return Object.entries(months).map(([k,items])=>`<section class="grp"><h2>${fmt(k+"-01",{month:"long",year:"numeric"})}<span>${items.filter(i=>S.c[i.id]).length}/${items.length}</span></h2>${items.map(d=>{
    const end=d.e?`–${fmt(d.e,{month:d.e.slice(5,7)===d.s.slice(5,7)?undefined:"short",day:"numeric"})}`:"";
    return `<div class="row${nxt&&nxt.id===d.id?" next-up":""}"><input type="checkbox" id="c-${esc(d.id)}" data-check="${esc(d.id)}" ${S.c[d.id]?"checked":""} aria-label="Done">
      <span class="date"><b>${fmt(d.s,{month:"short",day:"numeric"})}${end}</b>${fmt(d.s,{weekday:"short"})}</span>
      <span class="txt"><span class="chip" style="--cc:var(${CC[d.c]})">${d.c}</span><label class="t" for="c-${esc(d.id)}">${esc(d.t)}</label>${d.n?`<span class="n">${esc(d.n)}</span>`:""}${d.p?`<span class="p">${esc(d.p)}</span>`:""}${S.c[d.id]&&d.c!=="Post"?`<span class="meta"><span class="stars-label">How was it?</span>${stars(d.id)}</span>`:""}</span></div>`}).join("")}</section>`).join("");
}

/* ---------- plan: kayak / gear / bookings ---------- */
const cost=g=>g.backup||g.excl?0:g.price*g.qty;
function renderGear(tab){
  const L=GEAR.filter(g=>tab==="book"?BOOK.includes(g.g):tab==="kayak"?KAY.includes(g.g):!BOOK.includes(g.g)&&!KAY.includes(g.g));
  const total=L.reduce((a,g)=>a+cost(g),0), left=L.filter(g=>!S.c[g.id]&&g.price>0).reduce((a,g)=>a+cost(g),0);
  setProgress(L.filter(g=>S.c[g.id]).length,L.length,tab==="book"?"booked":"bought");
  const groups={};L.forEach(g=>(groups[g.g]=groups[g.g]||[]).push(g));
  const label={kayak:"Kayak estimate (after selling the NuCanoe)",gear:"Gear estimate",book:"Bookings estimate (vehicle and admin not counted)"}[tab];
  return `<div class="totals"><div><b>${money(total)}</b><span>${label}</span></div><div><b>${money(left)}</b><span>Still to buy or book</span></div></div>`+
  Object.entries(groups).map(([k,items])=>{items=[...items].sort((a,b)=>a.b.localeCompare(b.b));
    return `<section class="grp"><h2>${esc(k)}<span>${items.filter(i=>S.c[i.id]).length}/${items.length} · ${money(items.reduce((a,g)=>a+cost(g),0))}</span></h2>${items.map(g=>{
      const pr=g.backup?`Backup · ${money(g.price)} <small>(not counted)</small>`:g.excl?"Not counted":g.price<0?`Credit ${money(g.price)}`:g.price?money(g.price)+(g.unit||"")+(g.qty>1?` <small>× ${g.qty} =</small> ${money(cost(g))}`:""):"Free";
      return `<div class="row"><input type="checkbox" id="c-${g.id}" data-check="${g.id}" ${S.c[g.id]?"checked":""} aria-label="Done">
      <span class="date"><b>${fmt(g.b,{month:"short",day:"numeric"})}</b>${g.b.slice(0,4)}</span>
      <span class="txt"><span class="top-line"><label class="t" for="c-${g.id}">${esc(g.t)}</label><span class="price">${pr}</span></span>
      <span class="pick">${esc(g.pick)}${g.url?` <a class="lnk" href="${g.url}" target="_blank" rel="noopener">Shop ↗</a>`:""}</span>
      <span class="n">For: ${esc(g.u)}</span>${g.n?`<span class="n">${esc(g.n)}</span>`:""}${g.pn?`<span class="n">${esc(g.pn)}</span>`:""}
      ${S.c[g.id]?`<span class="meta"><span class="stars-label">Rating</span>${stars(g.id)}</span>`:""}</span></div>`}).join("")}</section>`}).join("");
}

/* ---------- reference lists ---------- */
function renderRef(tab){
  const q=F.q.trim().toLowerCase();
  const all=REF.filter(r=>r.tab===tab);
  const L=all.filter(r=>(F.type==="All"||r.t===F.type)&&(!q||(r.n+" "+r.a+" "+r.d+" "+r.t).toLowerCase().includes(q)));
  const rated=all.filter(r=>S.r[r.id]).length;
  setProgress(rated,all.length,"rated");
  if(!L.length)return `<p class="empty">No matches. Try a different search or type.</p>`;
  const groups={};L.forEach(r=>(groups[r.t]=groups[r.t]||[]).push(r));
  return Object.entries(groups).map(([k,items])=>`<section class="grp"><h2>${esc(k)}<span>${items.length}</span></h2>${items.map(r=>`<div class="row ref"><span class="txt">
    <span class="top-line"><span class="t">${esc(r.n)}</span>${stars(r.id)}</span>
    <span class="meta">${r.a?`<span>${esc(r.a)}</span>`:""}${dirLink(r.q)}</span>
    ${r.d?`<span class="n">${esc(r.d)}</span>`:""}</span></div>`).join("")}</section>`).join("");
}

/* ---------- map ---------- */
const MC={Launch:"--c-launch",Shore:"--c-shore",Spear:"--c-spear",Charter:"--c-charter","No-take":"--fg",Hike:"--c-hike",Food:"--c-food",Football:"--c-football",Photo:"--c-photo"};
const MLBL={Launch:"Kayak launches",Shore:"Shore & ulua",Spear:"Spearfishing",Charter:"Charter harbor","No-take":"No-take zones",Hike:"Hikes",Food:"Food",Football:"Football",Photo:"Photo spots"};
const LON0=-158.30,LAT1=21.73,KX=1580*Math.cos(21.45*Math.PI/180),KY=1580;
const px=(lat,lon)=>[((lon-LON0)*KX).toFixed(1),((LAT1-lat)*KY).toFixed(1)];
function planHits(k){if(!k)return[];const re=new RegExp(k,"i");return DATA.filter(d=>d.c!=="Post"&&(re.test(d.t)||re.test(d.n||"")))}
const RC={eat:"--c-food",date:"--c-trip",shops:"--c-fish",supplies:"--c-football",hank:"--c-hike",health:"--c-spear"};
const RL={eat:"Eat",date:"Date spots",shops:"Shops",supplies:"Groceries & hardware",hank:"Hank",health:"Health & safety"};
function mapPins(){
  if(UI.sec==="plan")return MAP.pins.map(p=>({c:p.c,n:p.n,lat:p.lat,lon:p.lon,d:p.d,q:p.q,how:p.how,why:p.why,k:p.k,rid:p.c==="No-take"?null:"m:"+p.n,color:MC[p.c],lbl:MLBL[p.c],notake:p.c==="No-take"}));
  return REF.filter(r=>r.lat).map(r=>({c:r.tab,n:r.n,lat:r.lat,lon:r.lon,d:r.d,q:r.q,a:r.a,t:r.t,rid:r.id,color:RC[r.tab],lbl:RL[r.tab]+" · "+r.t}));
}
function renderMap(){
  const P=mapPins(), cats=UI.sec==="plan"?Object.keys(MC):Object.keys(RC);
  const catColor=c=>UI.sec==="plan"?MC[c]:RC[c], catLbl=c=>UI.sec==="plan"?MLBL[c]:RL[c];
  const show=p=>F.mapF==="All"||p.c===F.mapF;
  const coast=MAP.coast.map(([a,o])=>px(a,o).join(",")).join(" ");
  const lab=(t,a,o,r)=>{const [x,y]=px(a,o);return `<text class="rlabel" x="${x}" y="${y}" text-anchor="middle"${r?` transform="rotate(${r} ${x} ${y})"`:""}>${t}</text>`};
  const pins=P.map((p,i)=>({p,i})).filter(o=>show(o.p)).map(({p,i})=>{const [x,y]=px(p.lat,p.lon);
    return `<g class="pin${p.notake?" notake":""}${F.mapSel===i?" sel":""}" data-pin="${i}" tabindex="0" role="button" aria-label="${esc(p.n)}"><circle cx="${x}" cy="${y}" r="${p.notake?16:9}" style="fill:var(${p.color})"></circle></g>`}).join("");
  let info=`<div class="info"><h3>Tap a pin</h3><span class="n">${UI.sec==="plan"?"See what it is, how to get there, and when it's on your plan.":"See what it is, rate it, and get directions."}</span></div>`;
  if(F.mapSel!==null&&P[F.mapSel]){const p=P[F.mapSel];const hits=UI.sec==="plan"?planHits(p.k):[];
    info=`<div class="info"><span class="chip" style="--cc:var(${p.color})">${esc(p.lbl)}</span><h3>${esc(p.n)}</h3>${p.a?`<span class="n">${esc(p.a)}</span>`:""}${p.rid?`<span class="meta"><span class="stars-label">Your rating</span>${stars(p.rid)}</span>`:""}
    ${p.d?`<span class="n">${esc(p.d)}</span>`:""}${p.how?`<span class="n how"><b class="${p.how==="Rideshare"?"rs":""}">${p.how}</b>${esc(p.why)}</span>`:""}
    ${p.q?`<a class="dir" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.q)}" target="_blank" rel="noopener">Directions in Google Maps ↗</a>`:""}
    ${hits.length?`<ul>${hits.slice(0,6).map(h=>`<li><b>${fmt(h.s,{month:"short",day:"numeric",year:"numeric"})}</b>${esc(h.t)}</li>`).join("")}${hits.length>6?`<li>and ${hits.length-6} more</li>`:""}</ul>`:""}</div>`}
  const groups={};P.forEach((p,i)=>{if(show(p))(groups[p.c]=groups[p.c]||[]).push({p,i})});
  const ratable=P.filter(p=>p.rid);
  setProgress(ratable.filter(p=>S.r[p.rid]).length,ratable.length,"rated");
  return `<div class="chips">${["All",...cats].map(c=>`<button data-mapf="${c}" aria-pressed="${c===F.mapF}">${c==="All"?"All":`<i style="--cc:var(${catColor(c)})"></i>${catLbl(c)}`}</button>`).join("")}</div>
  <div class="mapbox"><svg viewBox="0 0 1000 774" role="img" aria-label="Map of Oahu"><polygon class="land" points="${coast}"></polygon>
  ${lab("NORTH SHORE",21.705,-158.13,-28)}${lab("WEST SIDE",21.46,-158.268,-72)}${lab("WINDWARD",21.47,-157.72,62)}${lab("SOUTH SHORE",21.243,-157.86,0)}${lab("HONOLULU",21.335,-157.84,0)}${pins}</svg></div>
  ${info}
  <div class="spots">${Object.entries(groups).map(([c,arr])=>arr.map(({p,i})=>`<button data-pin="${i}"><i style="--cc:var(${p.color})"></i>${esc(p.n)}${p.how==="Rideshare"?` <small class="stars-label">Rideshare</small>`:""}</button>`).join("")).join("")}</div>
  ${UI.sec==="ref"?`<p class="legend">Chains with many locations (Foodland, Times, Safeway, Whole Foods, Target, Home Depot, Lowe's) aren't pinned; use their Directions links to find the nearest one.</p>`:""}`;
}
/* ---------- main render + events ---------- */
function renderMain(){
  const tab=curTab();let h="";
  if(tab==="map")h=renderMap();
  else if(UI.sec==="plan")h=tab==="cal"?renderCal():renderGear(tab);
  else h=renderRef(tab);
  $("#main").innerHTML=h;
}
function setFoot(){
  const tab=curTab();
  const msg=tab==="map"?"Schematic map, not for navigation. No-take zones from DLNR; check current rules before you fish or dive.":UI.sec==="plan"
    ?(tab==="cal"?"Holiday dates assume your company observes Hawaii state holidays. Never geotag fishing or spear spots.":"Prices are estimates; Hawaii retail runs 10–20% above mainland. Shop links open a Google Shopping search.")
    :(tab==="map"?"Schematic map, not for navigation. No-take zones from DLNR; check current rules before you fish or dive.":"Hours change, so check before you go. Ratings are private to you.");
  $("#foot").innerHTML=`${msg} <span class="sync">· ${sync}</span>`;
}
const main=$("#main");
main.addEventListener("change",e=>{const id=e.target.dataset.check;if(!id)return;if(e.target.checked)S.c[id]=true;else delete S.c[id];persist();renderMain();renderNext()});
main.addEventListener("click",e=>{
  const s=e.target.closest("[data-star]");
  if(s){e.preventDefault();const id=s.dataset.star,v=+s.dataset.v;if(S.r[id]===v)delete S.r[id];else S.r[id]=v;persist();
    s.parentElement.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",(S.r[id]||0)>i));
    const tab=curTab();if(UI.sec==="ref"||tab==="map"){const el=$("#prog");if(el){const all=tab==="map"?mapPins().filter(p=>p.rid).map(p=>p.rid):REF.filter(r=>r.tab===tab).map(r=>r.id);setProgress(all.filter(x=>S.r[x]).length,all.length,"rated")}}
    return}
  const mf=e.target.closest("[data-mapf]");if(mf){F.mapF=mf.dataset.mapf;F.mapSel=null;renderMain();return}
  const pin=e.target.closest("[data-pin]");if(pin){F.mapSel=+pin.dataset.pin;renderMain()}
});
main.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".pin")){e.preventDefault();F.mapSel=+e.target.dataset.pin;renderMain()}});
renderNav();renderTools();renderMain();renderNext();setFoot();

/* ---- PWA: offline + storage ---- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()});
}
</script>
</body>
</html>
